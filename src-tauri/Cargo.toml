[package]
name = "claude-companion"
description = "A Codex-compatible desktop pet that shows what Claude is doing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "claude-companion"

[lib]
# `_lib` suffix avoids a name clash with the bin target on Windows (Tauri convention).
name = "claude_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "claude-companion"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# No dev server: ui/ is static, so the bundled custom protocol is always on.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
